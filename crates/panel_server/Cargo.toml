[package]
name = "panel_server"
description = "The Service-Arb panel service: the `panel` binary, its CLI and the HTTP ingest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

# The binary keeps the name the image, the flake and the docs know it by.
[[bin]]
name = "panel"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
color-eyre.workspace = true
ev_lib = { workspace = true, features = ["settings", "error_monitoring"] }
eyre.workspace = true
http-body-util.workspace = true
jiff.workspace = true
panel.workspace = true
panel_contracts.workspace = true
panel_core.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures.workspace = true
panel = { workspace = true, features = ["testing"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
