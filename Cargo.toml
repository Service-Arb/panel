[workspace]
resolver = "3"
members = [
    "crates/panel_contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/Service-Arb/panel"
readme = "README.md"

[workspace.dependencies]
panel = { path = "crates/panel", version = "0.1.0" }
panel_contracts = { path = "crates/panel_contracts", version = "0.1.0" }
panel_core = { path = "crates/panel_core", version = "0.1.0" }

axum = "0.8"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
ev_lib = { version = "0.23", default-features = false }
eyre = "0.6"
getrandom = "0.3"
hex = "0.4"
hmac = "0.13"
jiff = "0.2"
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
zeroize = "1"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"

[workspace.lints.rust]
unused_features = "allow"
